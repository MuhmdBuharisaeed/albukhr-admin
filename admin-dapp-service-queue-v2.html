<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>ALBUKHR Admin — dApp Service Queue</title><link rel="stylesheet" href="css/admin-dapp-service-queue-v2.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script><script src="js/core/environment-core.js" defer></script><script src="js/core/supabase-core.js" defer></script><script src="js/core/supabase-admin-auth.js" defer></script><script src="js/admin-dapp-service-queue-v2.js" defer></script></head><body><header><a href="admin-dashboard.html"><b>ALBUKHR ADMIN</b></a><span>MAINNET</span><button id="logout">Sign out</button></header><main><a href="admin-dashboard.html">← Admin Control Center</a><h1>Pi dApp Service Queue</h1><div id="status" class="status" role="status" aria-live="polite">Verifying Admin session…</div><label for="filter">Status filter</label><select id="filter"><option value="">All</option><option>submitted</option><option>under_review</option><option>needs_information</option><option>revision_requested</option><option>quote_issued</option><option>quote_accepted</option><option>approved</option><option>queued</option><option>in_progress</option><option>delivered</option><option>completed</option><option>rejected</option><option>cancelled</option></select><button id="refresh">Refresh</button><section class="grid"><article class="card"><h2>Requests</h2><div id="queue">Loading…</div></article><article class="card"><h2>Request detail</h2><div id="detail">Select a request.</div><form id="transition" hidden><h3>Change status</h3><label for="target">Target status</label><select id="target" required><option value="">Select</option><option>under_review</option><option>needs_information</option><option>revision_requested</option><option>rejected</option><option>cancelled</option><option>approved</option><option>queued</option><option>in_progress</option><option>delivered</option><option>completed</option></select><label for="reason">Audit note</label><textarea id="reason" maxlength="1000"></textarea><button>Save status</button></form><form id="quote" hidden><h3>Issue PI quote</h3><label for="scope">Scope</label><textarea id="scope" required maxlength="6000"></textarea><label for="exclusions">Exclusions (one per line)</label><textarea id="exclusions"></textarea><label for="deliverables">Deliverables (one per line)</label><textarea id="deliverables" required></textarea><label for="amount">Total PI</label><input id="amount" type="number" min="0.0000001" step="0.0000001" required><label for="expiry">Valid until</label><input id="expiry" type="datetime-local" required><label for="terms">Terms version</label><input id="terms" value="dapp-service-terms-v1" required><button>Issue quote</button></form></article></section></main></body></html>
