<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ALBUKHR Reset Password</title>

<link rel="stylesheet" href="css/admin-auth.css">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/core/environment-core.js"></script>
<script src="js/core/supabase-core.js"></script>
<script src="js/core/supabase-admin-auth.js"></script>
</head>

<body>
<main class="admin-auth">
<section class="admin-card">

<div class="admin-brand">ALBUKHR</div>
<div class="admin-label">ACCOUNT RECOVERY</div>

<h1>Create a new password</h1>
<p class="muted">
  Use a strong password of at least 12 characters.
</p>

<form id="resetForm" novalidate>
<label>
  New password
  <input
    id="password"
    type="password"
    autocomplete="new-password"
    minlength="12"
    required
  >
</label>

<label>
  Confirm password
  <input
    id="confirm"
    type="password"
    autocomplete="new-password"
    minlength="12"
    required
  >
</label>

<button id="saveButton" type="submit" disabled>
  Update password
</button>

<div id="status" class="status" aria-live="polite"></div>
</form>

</section>
</main>

<script>
(async function () {
  "use strict";

  const form = document.getElementById("resetForm");
  const password = document.getElementById("password");
  const confirm = document.getElementById("confirm");
  const button = document.getElementById("saveButton");
  const status = document.getElementById("status");

  let recoverySession = null;
  let recoveryReady = false;

  function show(message, error) {
    status.textContent = message;
    status.classList.toggle("error", Boolean(error));
  }

  function setReady(ready) {
    recoveryReady = Boolean(ready);
    button.disabled = !recoveryReady;
  }

  function isRecoveryRequest() {
    const query = new URLSearchParams(window.location.search);
    const hash = new URLSearchParams(
      window.location.hash.replace(/^#/, "")
    );

    return (
      query.get("type") === "recovery" ||
      hash.get("type") === "recovery" ||
      Boolean(query.get("code")) ||
      Boolean(hash.get("access_token"))
    );
  }

  async function waitForRecoverySession(client, timeoutMs) {
    const existing = await client.auth.getSession();

    if (existing.data && existing.data.session) {
      return existing.data.session;
    }

    return new Promise(function (resolve) {
      let settled = false;

      const finish = function (session) {
        if (settled) return;
        settled = true;
        window.clearTimeout(timer);
        resolve(session || null);
      };

      const timer = window.setTimeout(function () {
        finish(null);
      }, timeoutMs);

      client.auth.onAuthStateChange(function (event, session) {
        if (
          event === "PASSWORD_RECOVERY" ||
          event === "SIGNED_IN" ||
          event === "TOKEN_REFRESHED"
        ) {
          if (session) {
            finish(session);
          }
        }
      });
    });
  }

  async function establishRecoverySession(client) {
    /*
     * Supabase may use PKCE and return ?code=...
     * Exchange it before attempting password update.
     */
    const query = new URLSearchParams(window.location.search);
    const code = query.get("code");

    if (code) {
      const result = await client.auth.exchangeCodeForSession(code);

      if (result.error) {
        throw result.error;
      }
    }

    /*
     * For hash-based recovery links, Supabase Auth normally
     * detects the access/refresh tokens automatically.
     */
    const session = await waitForRecoverySession(client, 5000);

    if (!session || !session.user) {
      return null;
    }

    return session;
  }

  try {
    const environment = window.ALBukhrEnvironment;

    if (
      !environment ||
      typeof environment.isKnown !== "function" ||
      !environment.isKnown() ||
      !environment.isMainnet()
    ) {
      throw new Error(
        "Admin account recovery is available only on ALBUKHR MAINNET."
      );
    }

    const supabaseCore = window.ALBUKHR_SUPABASE;

    if (!supabaseCore || !supabaseCore.client) {
      throw new Error("ALBUKHR Supabase Core is unavailable.");
    }

    if (
      supabaseCore.environment !== "mainnet" ||
      supabaseCore.network !== "mainnet"
    ) {
      throw new Error(
        "Admin recovery cannot use a non-Mainnet Supabase client."
      );
    }

    const client = supabaseCore.client;

    show("Verifying recovery session...");

    recoverySession = await establishRecoverySession(client);

    if (!recoverySession) {
      setReady(false);
      show(
        "Recovery session missing or expired. Please request a new reset email and open its Reset Password link again.",
        true
      );
      return;
    }

    /*
     * Keep the existing central admin-auth engine as the
     * authority for the actual password update.
     */
    await window.AlbukhrSupabaseAdminAuth.init();

    const sessionCheck = await client.auth.getSession();

    if (
      !sessionCheck.data ||
      !sessionCheck.data.session ||
      sessionCheck.data.session.user.id !== recoverySession.user.id
    ) {
      setReady(false);
      show(
        "Recovery session could not be verified. Please request a new reset email.",
        true
      );
      return;
    }

    setReady(true);
    show("Recovery session verified. You can now create a new password.");

  } catch (error) {
    console.error("[ALBUKHR PASSWORD RECOVERY]", error);
    setReady(false);
    show(
      error && error.message
        ? error.message
        : "Unable to establish the recovery session.",
      true
    );
  }

  form.addEventListener("submit", async function (event) {
    event.preventDefault();

    if (!recoveryReady) {
      show(
        "Recovery session is not ready. Please open a fresh Reset Password link from your email.",
        true
      );
      return;
    }

    const newPassword = password.value;
    const confirmation = confirm.value;

    if (newPassword.length < 12) {
      show("Password must be at least 12 characters.", true);
      return;
    }

    if (newPassword !== confirmation) {
      show("Passwords do not match.", true);
      return;
    }

    button.disabled = true;
    show("Updating password...");

    try {
      await window.AlbukhrSupabaseAdminAuth.updatePassword(
        newPassword
      );

      show("Password updated successfully. Redirecting to admin login...");

      window.setTimeout(function () {
        window.AlbukhrSupabaseAdminAuth
          .signOut()
          .finally(function () {
            window.location.replace("admin-login.html");
          });
      }, 900);

    } catch (error) {
      console.error("[ALBUKHR PASSWORD UPDATE]", error);

      show(
        error && error.message
          ? error.message
          : "Unable to update password.",
        true
      );

      button.disabled = false;
    }
  });
})();
</script>

</body>
</html>
