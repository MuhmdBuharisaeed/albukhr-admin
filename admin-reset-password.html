<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ALBUKHR Reset Password</title>
<link rel="stylesheet" href="css/admin-auth.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/core/environment-core.js"></script>
<script src="js/core/supabase-core.js"></script>
<script src="js/core/supabase-admin-auth.js"></script>
</head>
<body>
<main class="admin-auth">
<section class="admin-card">
<div class="admin-brand">ALBUKHR</div>
<div class="admin-label">ACCOUNT RECOVERY</div>
<h1>Create a new password</h1>
<p class="muted">Use a strong password of at least 12 characters.</p>

<form id="resetForm">
<label>
New password
<input id="password" type="password" autocomplete="new-password" minlength="12" required>
</label>

<label>
Confirm password
<input id="confirm" type="password" autocomplete="new-password" minlength="12" required>
</label>

<button id="saveButton" type="submit">Update password</button>
<div id="status" class="status" aria-live="polite"></div>
</form>
</section>
</main>

<script>
(async function () {
  "use strict";

  const form = document.getElementById("resetForm");
  const password = document.getElementById("password");
  const confirm = document.getElementById("confirm");
  const button = document.getElementById("saveButton");
  const status = document.getElementById("status");

  function show(message, error) {
    status.textContent = message;
    status.classList.toggle("error", Boolean(error));
  }

  try {
    await window.AlbukhrSupabaseAdminAuth.init();
  } catch (error) {
    console.error(error);
    show("Recovery session is unavailable.", true);
  }

  form.addEventListener("submit", async function (event) {
    event.preventDefault();

    if (password.value !== confirm.value) {
      show("Passwords do not match.", true);
      return;
    }

    button.disabled = true;
    show("Updating password...");

    try {
      await window.AlbukhrSupabaseAdminAuth.updatePassword(
        password.value
      );

      show("Password updated. Please sign in again.");

      setTimeout(function () {
        window.AlbukhrSupabaseAdminAuth.signOut()
          .finally(function () {
            window.location.replace("admin-login.html");
          });
      }, 900);
    } catch (error) {
      console.error(error);
      show(error.message || "Unable to update password.", true);
      button.disabled = false;
    }
  });
})();
</script>
</body>
</html>
