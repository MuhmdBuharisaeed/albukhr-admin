<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ALBUKHR Admin Login</title>
<link rel="stylesheet" href="css/admin-auth.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/core/environment-core.js"></script>
<script src="js/core/supabase-core.js"></script>
<script src="js/core/supabase-admin-auth.js"></script>
</head>
<body>
<main class="admin-auth">
  <section class="admin-card">
    <div class="admin-brand">ALBUKHR</div>
    <div class="admin-label">ADMINISTRATION</div>

    <h1>Secure Admin Login</h1>
    <p class="muted">Mainnet administrative access only.</p>

    <form id="adminLoginForm" novalidate>
      <label>
        Admin email
        <input id="email" type="email" autocomplete="username" required>
      </label>

      <label>
        Password
        <input id="password" type="password" autocomplete="current-password" required>
      </label>

      <button id="loginButton" type="submit">Sign in securely</button>

      <button id="forgotButton" class="secondary" type="button">
        Forgot password?
      </button>

      <div id="status" class="status" aria-live="polite"></div>
    </form>
  </section>
</main>

<script>
(function () {
  "use strict";

  const form = document.getElementById("adminLoginForm");
  const email = document.getElementById("email");
  const password = document.getElementById("password");
  const button = document.getElementById("loginButton");
  const forgot = document.getElementById("forgotButton");
  const status = document.getElementById("status");

  function setStatus(message, error) {
    status.textContent = message || "";
    status.classList.toggle("error", Boolean(error));
  }

  async function boot() {
    try {
      await window.AlbukhrSupabaseAdminAuth.init();

      const admin =
        window.AlbukhrSupabaseAdminAuth.getCurrentAdmin();

      if (admin && admin.is_admin) {
        window.location.replace("admin-dashboard.html");
      }
    } catch (error) {
      console.error(error);
      setStatus(error.message || "Admin authentication unavailable.", true);
    }
  }

  form.addEventListener("submit", async function (event) {
    event.preventDefault();

    button.disabled = true;
    setStatus("Authenticating securely...");

    try {
      const admin =
        await window.AlbukhrSupabaseAdminAuth.signIn(
          email.value,
          password.value
        );

      const mfa =
        await window.AlbukhrSupabaseAdminAuth.ensureMfa();

      if (mfa.required && !mfa.verified) {
        sessionStorage.setItem(
          "albukhr_admin_mfa_factor",
          mfa.factorId
        );
        window.location.replace("admin-mfa.html");
        return;
      }

      setStatus("Authentication successful. Opening administration...");
      window.location.replace("admin-dashboard.html");
    } catch (error) {
      console.error(error);
      setStatus(
        "Authentication failed. Check your credentials or contact a super admin.",
        true
      );
      button.disabled = false;
    }
  });

  forgot.addEventListener("click", async function () {
    if (!email.value.trim()) {
      setStatus("Enter your admin email first.", true);
      email.focus();
      return;
    }

    forgot.disabled = true;
    setStatus("Sending password recovery instructions...");

    try {
      await window.AlbukhrSupabaseAdminAuth.resetPassword(
        email.value,
        window.location.origin + "/admin-reset-password.html"
      );

      setStatus(
        "If the account is eligible, recovery instructions have been sent."
      );
    } catch (error) {
      console.error(error);
      setStatus("Unable to start password recovery.", true);
    } finally {
      forgot.disabled = false;
    }
  });

  boot();
})();
</script>
</body>
</html>
