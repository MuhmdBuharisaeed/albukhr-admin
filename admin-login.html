<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#087a3e"><meta name="robots" content="noindex,nofollow"><title>ALBUKHR Admin Login</title><link rel="stylesheet" href="css/admin-auth.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script><script src="js/core/environment-core.js" defer></script><script src="js/core/supabase-core.js" defer></script><script src="js/core/supabase-admin-auth.js" defer></script><script src="js/admin-login.js" defer></script></head><body><main class="admin-auth"><section class="admin-card" aria-labelledby="adminLoginTitle"><div class="brand-mark"><img src="images/albukhr-eagle-logo.jpg" alt="ALBUKHR" onerror="this.style.display='none'"></div><div class="admin-brand">ALBUKHR</div><div class="admin-label">ADMINISTRATION</div><div class="security-badge">MAINNET SECURITY GATE</div><h1 id="adminLoginTitle">Secure Admin Login</h1><p class="muted">Authorized ALBUKHR administrators only. Administrative authentication is handled by Supabase.</p><form id="adminLoginForm" novalidate><label for="adminEmail">Admin email<input id="adminEmail" name="email" type="email" inputmode="email" autocomplete="username" maxlength="254" required></label><label for="adminPassword">Password<div class="password-field"><input id="adminPassword" name="password" type="password" autocomplete="current-password" minlength="12" required><button id="togglePassword" class="password-toggle" type="button" aria-label="Show password" aria-pressed="false">Show</button></div></label><button id="loginButton" type="submit">Sign In Securely</button><button id="forgotPasswordButton" class="secondary" type="button">Forgot password?</button><div id="authStatus" class="status" aria-live="polite" aria-atomic="true"></div></form><div class="security-note"><strong>Protected administration</strong><span>Authentication, role authorization and MFA are verified against the ALBUKHR Mainnet security layer.</span></div></section></main></body></html>
